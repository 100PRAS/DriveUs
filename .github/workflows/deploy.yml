name: Deploy to IONOS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to IONOS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USER }}
          password: ${{ secrets.IONOS_PASS }}
          port: 22
          local_path: ./
          remote_path: ${{ secrets.IONOS_PATH }}
          sftp_only: true
          delete: false
          exclude: |
            .git*
            .github
            .vscode
            node_modules
            vendor
            .env
            .htaccess.local
            README.md
